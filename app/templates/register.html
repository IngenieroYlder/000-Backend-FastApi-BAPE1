<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BAPE</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.5rem; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .error { color: red; font-size: 0.875rem; display: none; margin-top: 0.5rem; }
        .link { text-align: center; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 style="text-align: center;">Crear Cuenta BAPE</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Nombre de Empresa</label>
                <input type="text" id="companyName" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Registrarse</button>
            <p class="error" id="errorMessage"></p>
            <div class="link">
                <a href="/login">¿Ya tienes cuenta? Inicia Sesión</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMessage = document.getElementById('errorMessage');
            
            const data = {
                company_name: document.getElementById('companyName').value,
                email: document.getElementById('email').value,
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Registro exitoso. Ahora puedes iniciar sesión.');
                    window.location.href = '/login';
                } else {
                    const err = await response.json();
                    errorMessage.textContent = err.detail || 'Error en el registro';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Error de conexión';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
